[project]
name = "trakr"
version = "0.1.0"
description = "Trakr monorepo"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "src/packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.14.13,<0.15.0",
    "watchfiles>=0.24.0,<1.0.0",
    "coverage>=7.13.1,<8.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ipykernel>=7.1.0,<8.0.0",
]
