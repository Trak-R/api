[project]
name = "trakr-weather"
version = "0.1.0"
description = "Trakr weather domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
]

[tool.uv.sources]
trakr-core = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "weather" = "src" }
packages = [
    "weather",
    "weather.api",
    "weather.models",
    "weather.repository",
    "weather.schemas",
    "weather.services",
    "weather.tasks",
    "weather.tests",
]
