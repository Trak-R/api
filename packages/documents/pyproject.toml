[project]
name = "trakr-documents"
version = "0.1.0"
description = "Trakr documents domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
    "trakr-identity",
]

[tool.uv.sources]
trakr-core = { workspace = true }
trakr-identity = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "documents" = "src" }
packages = [
    "documents",
    "documents.api",
    "documents.models",
    "documents.repository",
    "documents.schemas",
    "documents.services",
    "documents.tasks",
    "documents.tests",
]
