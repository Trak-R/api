[project]
name = "trakr-review"
version = "0.1.0"
description = "Trakr review domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
    "trakr-identity",
]

[tool.uv.sources]
trakr-core = { workspace = true }
trakr-identity = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "review" = "src" }
packages = [
    "review",
    "review.api",
    "review.models",
    "review.repository",
    "review.schemas",
    "review.services",
    "review.tasks",
    "review.tests",
]
