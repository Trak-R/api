[project]
name = "trakr-discovery"
version = "0.1.0"
description = "Trakr discovery domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
    "trakr-identity",
]

[tool.uv.sources]
trakr-core = { workspace = true }
trakr-identity = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "discovery" = "src" }
packages = [
    "discovery",
    "discovery.api",
    "discovery.models",
    "discovery.repository",
    "discovery.schemas",
    "discovery.services",
    "discovery.tasks",
    "discovery.tasks.jobs",
    "discovery.tasks.orchestrators",
    "discovery.tests",
    "discovery.tests.services",
]
