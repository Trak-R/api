[project]
name = "trakr-notifications"
version = "0.1.0"
description = "Trakr notifications domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
]

[tool.uv.sources]
trakr-core = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "notifications" = "src" }
packages = [
    "notifications",
    "notifications.models",
]
