[project]
name = "trakr-identity"
version = "0.1.0"
description = "Trakr identity domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
]

[tool.uv.sources]
trakr-core = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "identity" = "src" }
packages = [
    "identity",
    "identity.api",
    "identity.models",
    "identity.repository",
    "identity.schemas",
    "identity.services",
    "identity.tasks",
    "identity.tests",
]
