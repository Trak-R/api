[project]
name = "trakr-reports"
version = "0.1.0"
description = "Trakr reports domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
    "trakr-identity",
]

[tool.uv.sources]
trakr-core = { workspace = true }
trakr-identity = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "reports" = "src" }
packages = [
    "reports",
    "reports.api",
    "reports.models",
    "reports.repository",
    "reports.schemas",
    "reports.services",
    "reports.tasks",
    "reports.tests",
]
