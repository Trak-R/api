[project]
name = "trakr-aircraft-telemetry"
version = "0.1.0"
description = "Trakr aircraft_telemetry domain"
requires-python = ">=3.12"
dependencies = [
    "trakr-core",
    "trakr-identity",
]

[tool.uv.sources]
trakr-core = { workspace = true }
trakr-identity = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
